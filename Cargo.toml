[package]
name = "modbus_calibrator"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.27"
egui = "0.27"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-modbus = "0.14"
tokio-serial = "5.4"

[build-dependencies]
winresource = "0.1"